name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows bundles
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload macOS bundles
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout (for version reading)
        uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles/
          merge-multiple: false

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES="See release notes at https://github.com/${REPO}/releases/tag/${TAG}"

          # GitHub Releases substitutes spaces with dots in asset filenames at
          # upload time. Rename local bundles the same way so latest.json URLs
          # match the public asset names.
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            renamed="${base// /.}"
            if [ "$base" != "$renamed" ]; then
              mv "$file" "$dir/$renamed"
            fi
          done < <(find bundles -type f -print0)

          read_sig() {
            local file
            file=$(find bundles/ -name "$1" -type f 2>/dev/null | head -1)
            [ -n "$file" ] && cat "$file" || echo ""
          }

          find_name() {
            find bundles/ -name "$1" -not -name "*.sig" -type f -printf "%f\n" 2>/dev/null | head -1
          }

          NSIS_NAME=$(find_name "*.exe")
          NSIS_SIG=$(read_sig "*.exe.sig")
          APPIMAGE_NAME=$(find_name "*.AppImage")
          APPIMAGE_SIG=$(read_sig "*.AppImage.sig")
          MACOS_NAME=$(find_name "*.app.tar.gz")
          MACOS_SIG=$(read_sig "*.app.tar.gz.sig")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$DATE" \
            --arg win_url "$BASE_URL/$NSIS_NAME" \
            --arg win_sig "$NSIS_SIG" \
            --arg lin_url "$BASE_URL/$APPIMAGE_NAME" \
            --arg lin_sig "$APPIMAGE_SIG" \
            --arg mac_url "$BASE_URL/$MACOS_NAME" \
            --arg mac_sig "$MACOS_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "linux-x86_64":   { signature: $lin_sig, url: $lin_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

          # Bail out loudly if any platform url ends in '/' (empty filename)
          # or any signature is empty. Either case means the bundle/sig was
          # missing — most likely TAURI_SIGNING_PRIVATE_KEY is not set.
          if grep -qE '"url": "[^"]*/"' latest.json || grep -q '"signature": ""' latest.json; then
            echo "::error::latest.json is incomplete — auto-update would fail in production."
            echo "Verify that TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets are configured, and that bundles for all targets were produced."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bundles/**/*
            latest.json
