[package]
name = "MyJournal"
version = "1.5.6"
description = "A Tauri application for writing daily journal entries."
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauract_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
uuid = { version = "1.23.1", features = ["v4", "fast-rng"] }
sha2 = "0.11.0"
# Pure-Rust deflate backend (miniz_oxide) instead of the default `flate2_zlib`,
# which pulls libz-sys and needs a C toolchain (`cc`) — fragile on Windows CI.
allsorts = { version = "0.15", default-features = false, features = [
	"outline",
	"flate2_rust",
] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls"] }
# Simulación de teclado para abrir el selector de emoji nativo del SO.
# En Linux (X11) requiere `libxdo-dev` en tiempo de compilación.
enigo = "0.2"

# Solo Linux: habilitar el corrector de WebKitGTK a nivel de WebContext
# (el atributo HTML `spellcheck` no basta). La versión debe coincidir con la
# que usa wry/Tauri (ver Cargo.lock: 2.0.x) para compartir el mismo tipo WebView.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

